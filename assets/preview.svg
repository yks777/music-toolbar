  </g>

  <text x="278" y="145" fill="currentColor" font-size="24" font-weight="700">Midnight Drive</text>
  <text x="278" y="175" fill="currentColor" font-size="17" opacity="0.8">Northbound</text>
  <text x="278" y="200" fill="currentColor" font-size="14" opacity="0.65">Static Radio</text>
  <text x="278" y="222" fill="currentColor" font-size="13" opacity="0.55">Independent</text>

  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
