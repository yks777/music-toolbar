  <text x="755" y="117" text-anchor="middle" fill="currentColor" font-size="19" font-weight="700">Lyrics</text>
  <text x="755" y="172" text-anchor="middle" fill="currentColor" font-size="15" opacity="0.55">Streetlights fade behind us</text>
  <text x="755" y="216" text-anchor="middle" fill="currentColor" font-size="18" font-weight="700">The night is calling out</text>
  <text x="755" y="259" text-anchor="middle" fill="currentColor" font-size="15" opacity="0.7">A quiet road, a radio</text>
  <text x="755" y="300" text-anchor="middle" fill="currentColor" font-size="15" opacity="0.55">And all the world slows down</text>
  <text x="755" y="337" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.45">[LRCLIB]</text>
</svg>
